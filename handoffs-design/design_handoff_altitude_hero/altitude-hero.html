<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Altitude Dining — Fine Dining. Above the Clouds.</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: oklch(0.13 0.008 60);
    --bg-deep: oklch(0.08 0.006 60);
    --cream: oklch(0.94 0.02 80);
    --cream-dim: oklch(0.72 0.018 80);
    --gold: oklch(0.78 0.10 80);
    --rule: oklch(0.94 0.02 80 / 0.16);
    --serif: "Cormorant Garamond", "Times New Roman", serif;
    --sans: "Manrope", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--cream); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; overflow-x: hidden; }

  /* ---------- HERO ---------- */
  .hero {
    position: relative;
    height: 100vh;
    min-height: 720px;
    overflow: hidden;
    isolation: isolate;
    background: var(--bg);
  }

  /* Background */
  .sky {
    position: absolute; inset: 0;
    background:
      radial-gradient(60% 50% at 50% 45%, oklch(0.19 0.018 70) 0%, transparent 70%),
      radial-gradient(120% 70% at 50% 110%, oklch(0.16 0.012 60) 0%, transparent 60%),
      var(--bg);
  }
  .grid-lines {
    position: absolute; inset: 0;
    background-image: linear-gradient(to bottom, transparent 49.5%, oklch(0.94 0.02 80 / 0.045) 50%, transparent 50.5%);
    background-size: 100% 18%;
    background-position: 0 50%;
    mask-image: radial-gradient(60% 60% at 50% 50%, black, transparent 80%);
    pointer-events: none;
    will-change: transform;
  }
  .stars {
    position: absolute; inset: -10% -5%;
    background-image:
      radial-gradient(1.2px 1.2px at 12% 22%, oklch(0.95 0.02 80 / 0.55) 50%, transparent 51%),
      radial-gradient(1px 1px at 78% 14%, oklch(0.95 0.02 80 / 0.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 33% 8%, oklch(0.95 0.02 80 / 0.55) 50%, transparent 51%),
      radial-gradient(1.4px 1.4px at 88% 38%, oklch(0.95 0.02 80 / 0.4) 50%, transparent 51%),
      radial-gradient(1px 1px at 55% 28%, oklch(0.95 0.02 80 / 0.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 22% 48%, oklch(0.95 0.02 80 / 0.25) 50%, transparent 51%),
      radial-gradient(1.6px 1.6px at 68% 58%, oklch(0.78 0.10 80 / 0.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 8% 70%, oklch(0.95 0.02 80 / 0.3) 50%, transparent 51%),
      radial-gradient(1px 1px at 92% 78%, oklch(0.95 0.02 80 / 0.35) 50%, transparent 51%);
    will-change: transform;
  }

  .top-fade {
    position: absolute; inset: 0 0 auto 0; height: 180px;
    background: linear-gradient(to bottom, var(--bg-deep), transparent);
    pointer-events: none; z-index: 8;
  }
  .bottom-fade {
    position: absolute; inset: auto 0 0 0; height: 32%;
    background: linear-gradient(to bottom, transparent, var(--bg) 80%);
    pointer-events: none; z-index: 4;
  }

  /* ---------- SIDE COORDINATES ---------- */
  .side {
    position: absolute;
    top: 50%;
    z-index: 6;
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--cream-dim);
    writing-mode: vertical-rl;
    display: flex;
    align-items: center;
    gap: 18px;
    opacity: 0;
    animation: fadeIn 1.4s cubic-bezier(0.2, 0.7, 0.2, 1) 0.8s forwards;
  }
  .side .tick {
    width: 4px; height: 4px;
    background: var(--gold);
    border-radius: 50%;
  }
  .side .rule {
    width: 1px;
    background: var(--rule);
  }
  .side.left {
    left: 44px;
    transform: translateY(-50%) rotate(180deg);
  }
  .side.left .rule { height: 40px; }
  .side.right {
    right: 44px;
    transform: translateY(-50%);
  }
  .side.right .rule { height: 40px; }
  .side .label {
    color: var(--cream-dim);
  }
  .side .v {
    color: var(--cream);
    letter-spacing: 0.32em;
  }
  .side .gold { color: var(--gold); }

  /* ---------- JET ---------- */
  .jet-stage {
    position: absolute;
    inset: 0;
    z-index: 3;            /* BEHIND the title lines so it appears through the gap */
    pointer-events: none;
    overflow: visible;
  }
  .jet {
    position: absolute;
    left: 50%;
    bottom: 0;
    height: 118vh;
    width: auto;
    /* Initial state set by JS rAF loop; we just hide until JS runs. */
    transform: translate3d(-50%, 110%, 0);
    transform-origin: 50% 50%;
    filter:
      drop-shadow(0 30px 80px oklch(0 0 0 / 0.7))
      drop-shadow(0 0 50px oklch(0.78 0.10 80 / 0.18));
    will-change: transform, opacity;
    opacity: 0;
  }

  /* Soft warm glow that travels with the jet */
  .jet-glow {
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 80vmin;
    height: 60vmin;
    transform: translate3d(-50%, 30%, 0);
    background: radial-gradient(ellipse at center, oklch(0.78 0.10 80 / 0.22) 0%, transparent 65%);
    filter: blur(40px);
    pointer-events: none;
    will-change: transform, opacity;
    z-index: 2;
  }

  /* ---------- TITLE ---------- */
  .title {
    position: absolute;
    inset: 0;
    z-index: 5;
    margin: 0;
    pointer-events: none;
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(56px, 9.2vw, 156px);
    line-height: 0.92;
    letter-spacing: -0.018em;
    color: var(--cream);
    display: grid;
    grid-template-rows: 1fr auto auto 1fr;
    justify-items: center;
    text-align: center;
  }
  .title .line {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: baseline;
    width: 100%;
    /* Center gap — the corridor the jet flies through. */
    column-gap: clamp(120px, 14vw, 240px);
    white-space: nowrap;
  }
  .title .line-1 { grid-row: 2; }
  .title .line-2 { grid-row: 3; margin-top: 0.08em; }
  .title .word {
    display: inline-block;
    will-change: transform;
    overflow: hidden;       /* clip the rising .inner */
    padding: 0 0.02em 0.16em;
  }
  .title .word.l { justify-self: end;   text-align: right; }
  .title .word.r { justify-self: start; text-align: left; }
  .title .inner {
    display: inline-block;
    opacity: 0;
    transform: translateY(110%);
  }
  .title .line-1 .word.l .inner { animation: rise 1.4s cubic-bezier(0.2, 0.78, 0.15, 1) 0.35s forwards; }
  .title .line-1 .word.r .inner { animation: rise 1.4s cubic-bezier(0.2, 0.78, 0.15, 1) 0.42s forwards; }
  .title .line-2 .word.l .inner { animation: rise 1.4s cubic-bezier(0.2, 0.78, 0.15, 1) 0.55s forwards; }
  .title .line-2 .word.r .inner { animation: rise 1.4s cubic-bezier(0.2, 0.78, 0.15, 1) 0.62s forwards; }
  .title em {
    font-style: italic;
    font-weight: 300;
    color: var(--gold);
  }

  /* ---------- BELOW (scroll runway only) ---------- */
  .below {
    position: relative;
    z-index: 1;
    background: var(--bg);
    border-top: 1px solid var(--rule);
    padding: 160px 56px 200px;
    display: grid;
    place-items: center;
    text-align: center;
  }
  .below .label {
    font-size: 11px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 32px;
  }
  .below h2 {
    font-family: var(--serif);
    font-weight: 300;
    font-style: italic;
    font-size: clamp(36px, 4.6vw, 64px);
    line-height: 1.1;
    margin: 0;
    color: var(--cream);
    letter-spacing: -0.01em;
    max-width: 16ch;
  }

  /* ---------- KEYFRAMES ---------- */
  @keyframes rise {
    0% { opacity: 0; transform: translateY(110%); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    0% { opacity: 0; } 100% { opacity: 1; }
  }

  @media (max-width: 820px) {
    .side { font-size: 9px; }
    .side.left { left: 18px; }
    .side.right { right: 18px; }
    .jet { height: 100vh; }
    .below { padding: 100px 24px 120px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

  <section class="hero" id="hero" data-screen-label="Hero">
    <div class="sky"></div>
    <div class="stars" id="stars"></div>
    <div class="grid-lines" id="grid"></div>

    <div class="side left">
      <span class="label">N&nbsp;·&nbsp;47.4°&nbsp;22'</span>
      <span class="tick"></span>
      <span class="v gold">FL410</span>
      <span class="rule"></span>
      <span class="label">Mach&nbsp;0.85</span>
    </div>
    <div class="side right">
      <span class="label">W&nbsp;·&nbsp;122.3°&nbsp;18'</span>
      <span class="tick"></span>
      <span class="v">−54°C</span>
      <span class="rule"></span>
      <span class="label">Heading&nbsp;284°</span>
    </div>

    <div class="jet-glow" id="jetGlow"></div>
    <div class="jet-stage">
      <img class="jet" id="jet" src="assets/jet-vertical.png" alt="" />
    </div>

    <h1 class="title" aria-label="Fine Dining. Above the Clouds.">
      <span class="line line-1">
        <span class="word l" id="l1L"><span class="inner">Fine</span></span>
        <span class="word r" id="l1R"><span class="inner">Dining.</span></span>
      </span>
      <span class="line line-2">
        <span class="word l" id="l2L"><span class="inner"><em>Above</em>&nbsp;the</span></span>
        <span class="word r" id="l2R"><span class="inner">Clouds.</span></span>
      </span>
    </h1>

    <div class="top-fade"></div>
    <div class="bottom-fade"></div>
  </section>

  <section class="below" data-screen-label="Provenance">
    <div>
      <div class="label">Continue</div>
      <h2>Sourced at sea level. Served at altitude.</h2>
    </div>
  </section>

<script>
  /*
    Smooth scroll choreography — "the jet flies through the title":

    - At rest, the jet is parked off-screen (translateY 96%) so only the cockpit tip
      pokes above the bottom edge. The title sits intact, centered.
    - As scrollY climbs, a lerped value (smooth) drives:
        • the jet rising upward through the page,
        • the top title line ("Fine Dining.") translating up,
        • the bottom title line ("Above the Clouds.") translating down,
      so the jet appears to push between them and fly through the gap.
    - We lerp scrollY toward target each frame for an eased, buttery feel.
  */

  const heroEl    = document.getElementById('hero');
  const jet       = document.getElementById('jet');
  const jetGlow   = document.getElementById('jetGlow');
  const l1L       = document.getElementById('l1L');
  const l1R       = document.getElementById('l1R');
  const l2L       = document.getElementById('l2L');
  const l2R       = document.getElementById('l2R');
  const stars     = document.getElementById('stars');
  const grid      = document.getElementById('grid');

  let target = window.scrollY || 0;
  let smooth = target;
  const startTime = performance.now();
  const ENTER_MS  = 1400;
  const ENTER_DELAY = 200;

  window.addEventListener('scroll', () => {
    target = window.scrollY || 0;
  }, { passive: true });

  // Tunables
  const PEEK_PX         = 70;   // how far the cockpit tip pokes into the viewport at rest
  const SPLIT_MAX_VW    = 28;   // each side slides this many vw outward at full scroll
  const SMOOTHING       = 0.085;

  /*
    Compute the jet's translateY% bounds from REAL dimensions, not assumed-vh constants.

    The jet is anchored with bottom:0 inside .hero. At translateY(pct%), its top edge
    sits at viewport-Y = (hero.clientHeight - jet.offsetHeight) + (pct/100)*jh, given
    scrollY=0 and hero pinned to viewport top. We solve for the two states:

      restPct  -> jet TOP at viewport y = (vh - PEEK_PX)   (only PEEK_PX visible)
      exitPct  -> jet BOTTOM at viewport y = -PEEK_PX      (fully above the fold)

    This makes the choreography correct regardless of hero min-height, viewport size,
    or jet image aspect ratio.
  */
  function jetBounds() {
    const jh = jet.offsetHeight  || 1;
    const hh = heroEl.clientHeight;
    const vh = window.innerHeight;
    const restPct = ((vh - PEEK_PX) - (hh - jh)) / jh * 100;
    const exitPct = (-PEEK_PX - hh) / jh * 100;
    return { restPct, exitPct };
  }

  function easeInOut(t) {
    return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
  function clamp01(v) { return Math.max(0, Math.min(1, v)); }

  function frame() {
    smooth += (target - smooth) * SMOOTHING;

    const vh = window.innerHeight;
    const linearP = clamp01(smooth / vh);     // 0 → 1 across one viewport scroll
    const p = easeInOut(linearP);             // eased progress

    // Entrance progress (page load) — 0 → 1 over ENTER_MS after ENTER_DELAY.
    const elapsed = performance.now() - startTime - ENTER_DELAY;
    const enterP  = easeOut(clamp01(elapsed / ENTER_MS));

    // Computed rest & exit positions from actual element dimensions.
    const { restPct, exitPct } = jetBounds();
    const offRest = restPct + 18; // slightly lower than rest at load (cockpit hidden)
    const enterPct = offRest + (restPct - offRest) * enterP;
    const jetPct   = enterPct + (exitPct - restPct) * p;
    if (jet) {
      jet.style.transform = `translate3d(-50%, ${jetPct}%, 0) scale(${1 + p * 0.04})`;
      jet.style.opacity   = String(enterP);
    }

    // Glow tracks the jet, weakening as it exits
    if (jetGlow) {
      const glowPct = 30 + (-180) * p;
      jetGlow.style.transform = `translate3d(-50%, ${glowPct}%, 0)`;
      jetGlow.style.opacity = String(0.9 * (1 - p * 0.8));
    }

    // Title split — words slide horizontally outward as the jet rises through the gap.
    // Line 2 trails line 1 slightly for a layered feel.
    const split1 = SPLIT_MAX_VW * p;
    const split2 = SPLIT_MAX_VW * Math.max(0, p - 0.04) * 1.05;
    if (l1L) l1L.style.transform = `translate3d(${-split1}vw, 0, 0)`;
    if (l1R) l1R.style.transform = `translate3d(${ split1}vw, 0, 0)`;
    if (l2L) l2L.style.transform = `translate3d(${-split2}vw, 0, 0)`;
    if (l2R) l2R.style.transform = `translate3d(${ split2}vw, 0, 0)`;

    // Background parallax
    if (stars) stars.style.transform = `translate3d(0, ${linearP * vh * 0.08}px, 0)`;
    if (grid)  grid.style.transform  = `translate3d(0, ${-linearP * vh * 0.18}px, 0)`;

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
